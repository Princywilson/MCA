<!DOCTYPE html>
<html>
<head>
  <title>Event Registration</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }
    button {
      padding: 8px;
      margin-right: 5px;
    }
    .tab {
      display: none;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 8px;
      text-align: center;
    }
  </style>
</head>

<body>

<h2>Event Registration Application</h2>

<!-- Tabs -->
<button onclick="showTab('register')">Register</button>
<button onclick="showTab('view')">View Records</button>

<!-- Registration Form -->
<div id="register" class="tab">
  <h3>Register Event</h3>

  <form onsubmit="registerUser(); return false;">
    Name:<br>
    <input type="text" id="name"><br><br>

    Phone No:<br>
    <input type="text" id="phone"><br><br>

    Email:<br>
    <input type="text" id="email"><br><br>

    Address:<br>
    <textarea id="address"></textarea><br><br>

    <button type="submit">Register</button>
  </form>

  <p id="msg" style="color:red;"></p>
</div>

<!-- View Records -->
<div id="view" class="tab">
  <h3>Registered Users</h3>
  <table width="100%">
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Email</th>
      <th>Address</th>
    </tr>
    <tbody id="records"></tbody>
  </table>
</div>

<script>
  let users = [];

  function showTab(tab) {
    document.getElementById("register").style.display = "none";
    document.getElementById("view").style.display = "none";
    document.getElementById(tab).style.display = "block";
  }

  function registerUser() {
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let email = document.getElementById("email").value;
    let address = document.getElementById("address").value;
    let msg = document.getElementById("msg");

    // Validation
    if (name === "" || phone === "" || email === "" || address === "") {
      msg.innerText = "All fields are required";
      return;
    }

    if (phone.length !== 10 || isNaN(phone)) {
      msg.innerText = "Phone number must be 10 digits";
      return;
    }

    if (!email.includes("@") || !email.includes(".")) {
      msg.innerText = "Invalid email format";
      return;
    }

    // Store data
    users.push({ name, phone, email, address });

    msg.style.color = "green";
    msg.innerText = "Registration Successful";

    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("email").value = "";
    document.getElementById("address").value = "";

    showRecords();
  }

  function showRecords() {
    let table = document.getElementById("records");
    table.innerHTML = "";

    users.forEach(user => {
      table.innerHTML += `
        <tr>
          <td>${user.name}</td>
          <td>${user.phone}</td>
          <td>${user.email}</td>
          <td>${user.address}</td>
        </tr>
      `;
    });
  }

  // Default tab
  showTab("register");
</script>

</body>
</html>
